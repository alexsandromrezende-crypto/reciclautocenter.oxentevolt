.oil-hero h3{color:#fff;font-size:22px;margin:0 0 7px}.oil-hero p{color:#d5efe5;font-size:13px;max-width:740px;line-height:1.65}
.oil-hero .drop{font-size:54px;flex:none}.oil-flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:13px 0 18px}
.oil-node{background:#e8f5ee;border:1px solid #cfebde;border-radius:12px;padding:13px 8px;text-align:center;position:relative}.oil-node strong{display:block;font-size:12px;color:#174e43;margin:6px 0}.oil-node small{display:block;font-size:10px;color:#53746a;line-height:1.45}

.oil-note-list{margin:0;padding-left:20px;font-size:12px;line-height:1.75;color:#4b646b}.oil-badge{background:#e4f3e8;border-radius:7px;padding:3px 8px;color:#185a43;font-size:10px;font-weight:800}

 {id:'wheels',name:'Rodas',mass:65,newCost:4200,circCost:3700,recovered:43,type:'Alumínio secundário rastreável',why:'O alumínio recuperado pode voltar a fundições e compor novas rodas, sujeito a especificações.',area:'Rodagem',hint:'Reciclagem de metal reduz a demanda por material virgem.'},
 {id:'bumper',name:'Para-choques',mass:14,newCost:1700,circCost:1400,recovered:11,type:'Plástico reciclado compatível',why:'Após triagem e processamento, uma fração do plástico retorna à cadeia produtiva.',area:'Acabamento',hint:'A segregação correta do polímero melhora a recuperação.'},
 {id:'seats',name:'Bancos',mass:48,newCost:3600,circCost:3850,recovered:24,type:'Tecidos e espumas com insumos reciclados',why:'Materiais recuperados são aproveitados conforme os requisitos de desempenho.',area:'Interior',hint:'Circularidade e custo devem ser avaliados juntos.'},
 {id:'cables',name:'Cabos elétricos',mass:18,newCost:2100,circCost:1850,recovered:13,type:'Cobre reciclado em cabos certificados',why:'O cobre recuperado é refinado e reinserido em componentes adequados.',area:'Elétrica',hint:'Manter metais em circulação preserva recursos.'},

];
const BASE_RECORDS = [

 {id:'demo02',date:'2026-10-19',item:'Pneus substituídos',origin:'Pós-venda',method:'Reciclagem externa',status:'Encaminhado',received:55,returned:0,cost:170,value:0},
 {id:'demo03',date:'2026-10-20',item:'Motores elétricos usados',origin:'Pós-venda',method:'Remanufatura',status:'Reincorporado',received:110,returned:88,cost:350,value:3600},
 {id:'demo04',date:'2026-10-20',item:'Bateria fora de uso',origin:'Pós-venda',method:'Tratamento especializado',status:'Encaminhado',received:220,returned:0,cost:680,value:0},
 {id:'demo05',date:'2026-10-21',item:'Rodas de alumínio',origin:'Usinagem',method:'Reciclagem com reincorporação',status:'Reincorporado',received:74,returned:60,cost:230,value:1120},
 {id:'demo06',date:'2026-10-21',item:'Bancos e revestimentos',origin:'Montagem',method:'Reaproveitamento interno',status:'Reincorporado',received:38,returned:20,cost:125,value:310},
 {id:'demo07',date:'2026-10-22',item:'Cabos elétricos separados',origin:'Manutenção',method:'Triagem',status:'Em triagem',received:24,returned:0,cost:70,value:0}
];
const STORAGE='autocircular_senai_v1';
const AUTH_STORAGE='autocircular_senai_contas_v2';
const AUTH_SESSION='autocircular_senai_sessao_v2';
const PART_MASS=PARTS.reduce((s,p)=>s+p.mass,0);
const BASE_COST=PARTS.reduce((s,p)=>s+p.newCost,0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(n||0);
const num=(n,d=0)=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0);
const pct=n=>`${num(n,1)}%`;
const dateBR=s=>{if(!s)return '—';const [y,m,d]=String(s).substring(0,10).split('-');return `${d}/${m}/${y}`};
const stampBR=s=>new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const sum=(a,f)=>a.reduce((s,x)=>s+(Number(f(x))||0),0);
const OIL_START=[
{id:'oil-demo-1',date:'2026-10-20',source:'Manutenção de motor a combustão/híbrido',origin:'Oficina simulada',generated:70,collected:60,processed:40,base:30,status:'Rerrefino comprovado (simulação)',collector:'Coletora autorizada (fictícia)',certificate:'SIM-COLETA-001',mtr:'SIM-MTR-001',rerrefiner:'Rerrefinadora (fictícia)',cost:290,value:390,notes:'Lote didático: quantidades arbitrárias; não corresponde a uma operação real.'},
{id:'oil-demo-2',date:'2026-10-21',source:'Transmissão/diferencial',origin:'Pós-venda simulado',generated:25,collected:25,processed:25,base:17,status:'Rerrefino comprovado (simulação)',collector:'Coletora autorizada (fictícia)',certificate:'SIM-COLETA-002',mtr:'SIM-MTR-002',rerrefiner:'Rerrefinadora (fictícia)',cost:150,value:210,notes:'Lote fictício para testes de indicadores.'},
{id:'oil-demo-3',date:'2026-10-22',source:'Manutenção de motor a combustão/híbrido',origin:'Oficina simulada',generated:12,collected:0,processed:0,base:0,status:'Armazenado',collector:'',certificate:'',mtr:'',rerrefiner:'',cost:25,value:0,notes:'Aguardando coleta por operador autorizado.'}
];
const seed=()=>({records:structuredClone(BASE_RECORDS),sessions:[],oilLots:structuredClone(OIL_START),oilMissions:[]});
function load(){try{const raw=localStorage.getItem(STORAGE);if(raw){const state=JSON.parse(raw);if(Array.isArray(state.records)&&Array.isArray(state.sessions)){state.oilLots=Array.isArray(state.oilLots)?state.oilLots:structuredClone(OIL_START);state.oilMissions=Array.isArray(state.oilMissions)?state.oilMissions:[];return state}}}catch(e){}return seed()}
let state=load(), view='dashboard',game={idx:0,choices:{},alias:''},currentModal=null,observer=null,canvas=null,ctx=null,cam={yaw:.79,pitch:.24,zoom:1},pointer=null,lastFrame=0,hoverPart=null,hotspots=[];
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));return true}catch(e){toast('Não foi possível salvar. Verifique as permissões de armazenamento.');return false}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),3300)}
function recordStats(){let r=state.records;return{count:r.length,received:sum(r,x=>x.received),returned:sum(r,x=>x.returned),cost:sum(r,x=>x.cost),value:sum(r,x=>x.value),rate:sum(r,x=>x.received)?100*sum(r,x=>x.returned)/sum(r,x=>x.received):0}}
function gameStats(choices=game.choices){let selected=PARTS.filter(p=>choices[p.id]);let recovered=sum(PARTS,p=>choices[p.id]==='circular'?p.recovered:0);let cost=sum(PARTS,p=>choices[p.id]==='circular'?p.circCost:p.newCost);let circCount=selected.filter(p=>choices[p.id]==='circular').length;let savings=BASE_COST-cost;return{answered:selected.length,recovered,cost,circCount,savings,rate:recovered/PART_MASS*100,score:Math.round(recovered/PART_MASS*100)}}
function badgeStatus(s){let cl=s==='Reincorporado'?'green':s==='Em triagem'?'amber':'blue';return `<span class="tag ${cl}">${esc(s)}</span>`}
function title(text,subtitle,right=''){return `<div class="page-title"><div><h2>${text}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${right}</div>`}
function metric(label,value,sub,emoji){return `<div class="metric"><div class="metric-top"><label>${label}</label><span class="symbol">${emoji}</span></div><strong>${value}</strong><small>${sub}</small></div>`}

let authMode='login', authUser=null, authAccounts=readAccounts(), photoDraft='', photoStream=null;
function readAccounts(){try{const a=JSON.parse(localStorage.getItem(AUTH_STORAGE)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function saveAccounts(){try{localStorage.setItem(AUTH_STORAGE,JSON.stringify(authAccounts));return true}catch(e){showAuthError('Não foi possível salvar. Verifique se o armazenamento do navegador está disponível.');return false}}
function usernameKey(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,'')}
function randomHex(bytes=16){const b=new Uint8Array(bytes);crypto.getRandomValues(b);return Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function passwordHash(password,salt){if(!crypto.subtle)throw new Error('Este navegador não permite criptografia local segura. Use HTTPS ou localhost.');const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:120000},k,256);return Array.from(new Uint8Array(bits)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function showAuthError(msg){const n=document.getElementById('auth-error');if(n){n.textContent=msg;n.classList.remove('hidden')}else toast(msg)}
function photoElement(photo,cls='photo-preview'){return photo?`<img class="${cls}" src="${photo}" alt="Foto do perfil">`:`<div class="${cls}" aria-label="Sem foto">👤</div>`}
function photoFields(){return `<div class="photo-section">${photoElement(photoDraft)}<div class="photo-controls"><strong style="font-size:12px">Foto de perfil (opcional)</strong><div class="btnrow"><label class="btn tiny outline" for="photo-upload">📁 Enviar foto</label><input type="file" accept="image/png,image/jpeg,image/webp,image/*" id="photo-upload" class="sr-only"><button type="button" class="btn tiny secondary" data-camera-open>📷 Usar câmera</button>${photoDraft?'<button type="button" class="btn tiny outline" data-photo-remove>Remover</button>':''}</div><small style="font-size:10px;color:#668079">A imagem será reduzida para armazenamento neste aparelho.</small></div></div><div id="camera-panel" class="camera-panel hidden"><video autoplay playsinline muted id="live-camera" aria-label="Imagem da câmera"></video><div class="btnrow"><button class="btn tiny secondary" type="button" data-camera-capture>📷 Capturar imagem</button><button class="btn tiny outline" type="button" data-camera-close>Cancelar</button></div></div>`}
function renderAuth(mode='login'){authMode=mode;stopCamera();photoDraft='';const hasAdmin=authAccounts.length>0;document.getElementById('main-shell').classList.add('hidden');const a=document.getElementById('auth-screen');a.classList.remove('hidden');a.innerHTML=`<div class="auth-layout"><section class="auth-story"><div style="font-size:23px;font-weight:900">↻ AutoCircular <span style="color:#b9f5d3">SENAI</span></div><h1>Uma fábrica que pensa em ciclos.</h1><p>Entre, monte seu carro circular em 3D e descubra como suas decisões influenciam os materiais e os custos industriais.</p><div class="auth-stamps"><span>🚘 Desafio 3D de 8 componentes</span><span>♻ Logística reversa e economia circular</span><span>📈 Resultados e relatórios de desempenho</span></div></section><section class="auth-form-pane"><div class="auth-tabs"><button type="button" class="${mode==='login'?'active':''}" data-auth-mode="login">Entrar</button><button type="button" class="${mode==='register'?'active':''}" data-auth-mode="register">Criar conta</button></div><h2>${mode==='register'?'Criar meu acesso':'Boas-vindas de volta!'}</h2><p>${mode==='register'?'Escolha um identificador e sua senha para salvar suas atividades.':'Entre com o usuário e senha cadastrados neste navegador.'}</p><form id="auth-form" class="auth-fields">${mode==='register'?`<label>Nome ou apelido <input name="name" placeholder="Ex.: Ana / Equipe Verde" maxlength="50" required autocomplete="nickname"></label>`:''}<label>Usuário <input name="username" placeholder="Ex.: ana2026" minlength="3" maxlength="40" required autocomplete="username"></label><label>Senha <input name="password" type="password" minlength="6" maxlength="100" required autocomplete="${mode==='login'?'current-password':'new-password'}"></label>${mode==='register'?`<label>Confirmar senha <input name="confirm" type="password" minlength="6" required autocomplete="new-password"></label>${photoFields()}`:''}<div id="auth-error" class="auth-error hidden" role="alert"></div><button class="btn auth-submit" type="submit">${mode==='register'?'Criar conta e começar →':'Entrar no laboratório →'}</button></form><div class="auth-note">${mode==='register'&&!hasAdmin?'<b>Primeira conta:</b> será a conta do orientador (administrador), com acesso aos relatórios gerais.<br>':''}<b>Privacidade:</b> contas e fotos são locais; não há servidor nem recuperação de senha por e-mail. Use uma senha exclusiva para esta demonstração. A foto não é obrigatória. Para câmera, utilize HTTPS ou localhost e permita o acesso no navegador.</div></section></div>`;}
function loginUser(user){stopCamera();authUser=user;sessionStorage.setItem(AUTH_SESSION,user.id);document.getElementById('auth-screen').classList.add('hidden');document.getElementById('main-shell').classList.remove('hidden');updateUserUI();game={idx:0,choices:{},alias:user.name};setView('dashboard')}
function updateUserUI(){const el=document.getElementById('active-user');if(!el)return;el.innerHTML=`${photoElement(authUser.photo,'user-photo')}<div><strong>${esc(authUser.name)}</strong><small>${authUser.role==='admin'?'Orientador / administrador':'Participante'}</small></div>`;document.querySelectorAll('[data-admin-only]').forEach(x=>x.classList.toggle('hidden',authUser.role!=='admin'))}
function logoutUser(){stopCamera();authUser=null;sessionStorage.removeItem(AUTH_SESSION);game={idx:0,choices:{},alias:''};renderAuth('login');}
function bootstrapAuth(){const id=sessionStorage.getItem(AUTH_SESSION);const u=authAccounts.find(x=>x.id===id);if(u)loginUser(u);else renderAuth(authAccounts.length?'login':'register')}
async function toPortrait(file){if(!file||!file.type.startsWith('image/'))throw new Error('Selecione uma imagem JPG, PNG ou WebP.');if(file.size>9*1024*1024)throw new Error('A imagem precisa ter menos de 9 MB.');const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});const size=300,c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),side=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-side)/2,sy=(img.naturalHeight-side)/2;x.drawImage(img,sx,sy,side,side,0,0,size,size);return c.toDataURL('image/jpeg',.76)}finally{URL.revokeObjectURL(url)}}
function setPortrait(data){photoDraft=data;const parent=document.querySelector('.photo-section');if(parent)parent.outerHTML=photoFields().split('<div id="camera-panel"')[0];/* A área da câmera existente permanece. */}
async function startCamera(){const panel=document.getElementById('camera-panel');if(!panel){toast('Abra o cadastro ou seu perfil para usar a câmera.');return}try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('A câmera exige HTTPS ou localhost (e permissão do navegador).');stopCamera();photoStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640}},audio:false});panel.classList.remove('hidden');const v=document.getElementById('live-camera');v.srcObject=photoStream;await v.play()}catch(e){stopCamera();showAuthError('Não foi possível acessar a câmera. Autorize a permissão ou use “Enviar foto”. '+e.message)}}
function stopCamera(){if(photoStream){photoStream.getTracks().forEach(t=>t.stop());photoStream=null}const v=document.getElementById('live-camera');if(v)v.srcObject=null;const p=document.getElementById('camera-panel');if(p)p.classList.add('hidden')}
function captureCamera(){const v=document.getElementById('live-camera');if(!v||!v.videoWidth){toast('A imagem da câmera ainda não está disponível.');return}const c=document.createElement('canvas');c.width=c.height=300;const x=c.getContext('2d'),side=Math.min(v.videoWidth,v.videoHeight);x.translate(300,0);x.scale(-1,1);x.drawImage(v,(v.videoWidth-side)/2,(v.videoHeight-side)/2,side,side,0,0,300,300);setPortrait(c.toDataURL('image/jpeg',.76));stopCamera();toast('Foto capturada.')}
async function handleAuthForm(form){const btn=form.querySelector('[type="submit"]');btn.disabled=true;const fd=new FormData(form);try{const username=usernameKey(fd.get('username'));const password=String(fd.get('password')||'');if(username.length<3||password.length<6)throw new Error('Usuário com pelo menos 3 caracteres e senha com pelo menos 6.');if(authMode==='register'){const name=String(fd.get('name')||'').trim().slice(0,50);if(!name)throw new Error('Informe seu nome ou apelido.');if(password!==String(fd.get('confirm')||''))throw new Error('As senhas não conferem.');if(authAccounts.some(a=>a.username===username))throw new Error('Esse usuário já está cadastrado neste navegador.');const salt=randomHex(),hash=await passwordHash(password,salt);const u={id:'u'+randomHex(9),username,name,salt,hash,role:authAccounts.length?'student':'admin',photo:photoDraft,createdAt:new Date().toISOString()};authAccounts.push(u);if(!saveAccounts()){authAccounts.pop();return}loginUser(u);toast('Conta criada com sucesso!')}else{const u=authAccounts.find(a=>a.username===username);if(!u||await passwordHash(password,u.salt)!==u.hash)throw new Error('Usuário ou senha inválidos.');loginUser(u);toast('Acesso autorizado.')}}catch(e){showAuthError(e.message||'Não foi possível acessar.')}finally{btn.disabled=false}}
function renderProfile(){return `${title('Meu perfil','Atualize seu nome e sua foto. Os dados permanecem armazenados neste navegador.')}<div class="card profile-card"><form id="profile-form" class="profile-fields"><div class="photo-section">${photoElement(photoDraft||authUser.photo,'profile-photo')}<div><strong>Foto do perfil</strong><p class="small muted">Escolha um arquivo ou tire uma foto usando a câmera.</p><div class="btnrow"><label class="btn tiny outline" for="photo-upload">📁 Selecionar foto</label><input id="photo-upload" class="sr-only" type="file" accept="image/*"><button class="btn tiny secondary" type="button" data-camera-open>📷 Abrir câmera</button><button class="btn tiny outline" type="button" data-photo-remove>Remover foto</button></div></div></div><div id="camera-panel" class="camera-panel hidden"><video id="live-camera" playsinline autoplay muted></video><div class="btnrow"><button class="btn tiny secondary" type="button" data-camera-capture>Capturar foto</button><button class="btn tiny outline" type="button" data-camera-close>Cancelar</button></div></div><label>Nome ou apelido <input type="text" maxlength="50" name="name" value="${esc(authUser.name)}" required></label><div class="info-note"><b>Usuário:</b> ${esc(authUser.username)} · <b>Tipo:</b> ${authUser.role==='admin'?'Orientador':'Participante'}<br>O login é local e não compartilha dados com outros dispositivos.</div><div class="btnrow"><button class="btn" type="submit">Salvar meu perfil</button><button class="btn outline" type="button" data-logout>Sair da conta</button></div></form></div>`}
function saveProfile(form){const name=String(new FormData(form).get('name')||'').trim().slice(0,50);if(!name){toast('Informe um nome.');return}authUser.name=name;authUser.photo=photoDraft||'';const idx=authAccounts.findIndex(a=>a.id===authUser.id);authAccounts[idx]=authUser;if(!saveAccounts())return;updateUserUI();render();toast('Perfil atualizado.');}

function setView(v){if(!authUser)return;if(v==='reverse'&&authUser.role!=='admin'){toast('A edição da logística reversa é reservada ao orientador.');return}view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('current-title').textContent=({'dashboard':'Visão geral','game':'Monte um carro circular','reverse':'Logística reversa','oil':'Ciclo circular do óleo','reports':'Relatórios de desempenho','guide':'Sobre o projeto','profile':'Meu perfil'})[v];render();window.scrollTo({top:0,behavior:'instant'})}

function renderDashboard(){let s=recordStats();let actions=state.sessions.length;const methods=[['Remanufatura',sum(state.records.filter(x=>x.method==='Remanufatura'),x=>x.received)],['Reciclagem com reincorporação',sum(state.records.filter(x=>x.method==='Reciclagem com reincorporação'),x=>x.received)],['Outras rotas',sum(state.records.filter(x=>!['Remanufatura','Reciclagem com reincorporação'].includes(x.method)),x=>x.received)]];let mx=Math.max(1,...methods.map(x=>x[1]));return `

<div class="grid2"><div class="card"><div class="section-header"><div><h3>De onde vêm os materiais?</h3><p class="card-caption">Massa recebida por rota de tratamento · não confundir com massa reincorporada.</p></div><button class="btn tiny outline" data-view="reverse">Ver registros →</button></div>${methods.map(x=>`<div class="bar-row"><div class="bar-name">${x[0]}</div><div class="bar-value">${num(x[1])} kg</div><div class="track"><span style="width:${100*x[1]/mx}%"></span></div></div>`).join('')}<div class="info-note" style="margin-top:20px"><strong>O ponto central:</strong> encaminhar um resíduo à reciclagem não significa que ele já voltou à fábrica. O indicador conta somente a massa registrada como reincorporada.</div></div>
<div class="card"><div class="section-header"><div><h3>Ciclo da operação</h3><p class="card-caption">Representação dos registros da fábrica.</p></div></div><div class="split"><div class="donut" style="--value:${Math.max(0,Math.min(100,s.rate))}%"><div class="donut-hole"><strong>${pct(s.rate)}</strong><small>reincorporados</small></div></div><div class="legend"><div class="legend-item"><span class="dot" style="background:#28b18a"></span>${num(s.returned)} kg reincorporados</div><div class="legend-item"><span class="dot" style="background:#dce7e7"></span>${num(s.received-s.returned)} kg não reincorporados</div><div class="legend-item"><span class="dot" style="background:#e7a049"></span>${state.records.length} registros operacionais</div></div></div><div class="info-note" style="margin-top:17px">${actions?`Já foram concluídos <strong>${actions} desafios</strong> por visitantes.`:'Nenhum visitante concluiu o desafio 3D ainda. Seja o primeiro!'}<br><button class="btn tiny secondary" style="margin-top:9px" data-view="reports">Consultar desempenho</button></div></div></div>
<div class="stepflow"><div class="step"><div class="step-num">01</div><div><strong>Receber</strong><span>Registrar a peça que voltou por coleta ou pós-venda.</span></div></div><div class="step"><div class="step-num">02</div><div><strong>Inspecionar</strong><span>Definir reparo, reciclagem ou destinação especializada.</span></div></div><div class="step"><div class="step-num">03</div><div><strong>Reincorporar</strong><span>Reutilizar peças e matérias-primas que atendam aos requisitos.</span></div></div><div class="step"><div class="step-num">04</div><div><strong>Medir</strong><span>Conferir massa, custos e resultados de cada decisão.</span></div></div></div>
<p class="footer-note">Protótipo pedagógico. Todos os valores, custos, massas, registros e resultados são fictícios; não representam medições reais de uma unidade SENAI nem especificações de veículos.</p>`}

<div class="card" style="margin-top:16px"><h3>Limites e segurança do protótipo</h3><p class="explain">Todos os números são ilustrativos. O modelo 3D é conceitual. Materiais recuperados só podem ser usados em veículos se atenderem a requisitos técnicos, legais e de qualidade, especialmente em baterias e itens de segurança. Os participantes não devem desmontar baterias de alta tensão nem manipular resíduos perigosos reais. O aplicativo possui login demonstrativo, sem servidor, e armazena contas, fotos e dados localmente. Câmera exige HTTPS ou localhost; para uso em vários aparelhos seria necessário um backend. Para compilar resultados de mais de um aparelho, é necessário juntar os arquivos CSV exportados.</p></div>`}

function openSessionDetails(id){
 const s=state.sessions.find(x=>x.id===id&&(authUser.role==='admin'||x.userId===authUser.id));if(!s)return;
 const selected=PARTS.filter(p=>s.choices[p.id]==='circular');
 const moreCost=selected.filter(p=>p.circCost>p.newCost).map(p=>p.name);

pBR(x.createdAt))}${td(x.alias)}${td(`${x.circCount} de 8`)}${td(pct(x.rate))}${td(`${num(x.recovered)} kg`)}${td(money(x.savings))}</tr>`).join('')||'<tr><td colspan="6">Nenhum desafio concluído.</td></tr>'}</tbody></table><h2 class="p-h2">3. Alternativas circulares escolhidas pelos participantes</h2><table class="p-table"><thead><tr><th>Componente</th><th>Escolhas circulares</th><th>Taxa de escolha</th><th>Massa recuperada por escolha</th></tr></thead><tbody>${PARTS.map(p=>{let ct=ses.filter(x=>x.choices[p.id]==='circular').length;return `<tr>${td(p.name)}${td(`${ct} de ${ses.length}`)}${td(ses.length?pct(100*ct/ses.length):'—')}${td(`${num(p.recovered)} kg`)}</tr>`}).join('')}</tbody></table><h2 class="p-h2">4. Interpretação dos indicadores</h2><p class="p-note">A taxa da operação mede a massa efetivamente reincorporada dividida pela massa recebida. O índice circular de cada carro mede a fração de massa recuperada nos oito conjuntos estudados, não no automóvel inteiro. A diferença de custo é o custo hipotético de todos os componentes novos menos o custo do cenário escolhido. Indicadores do jogo não são produção real e não devem ser somados aos lotes.</p><p class="p-foot">AutoCircular SENAI • Protótipo para apresentação educativa. Custos e massas fictícios. Não substitui estudo técnico, certificação de componentes ou balanço ambiental real.</p>`}

function handleRecord(form){if(authUser.role!=='admin')return;const f=new FormData(form),received=Number(f.get('received')),returned=Number(f.get('returned')),cost=Number(f.get('cost')),value=Number(f.get('value')),status=String(f.get('status'));if(!Number.isFinite(received)||received<=0||!Number.isFinite(returned)||returned<0||returned>received||!Number.isFinite(cost)||cost<0||!Number.isFinite(value)||value<0){toast('Confira as quantidades: a massa reincorporada deve ficar entre 0 e a massa recebida.');return}if(status!=='Reincorporado'&&returned>0){toast('Para registrar massa reincorporada, selecione a situação “Reincorporado”.');return}if(status==='Reincorporado'&&returned===0){toast('Informe alguma massa efetivamente reincorporada ou altere a situação.');return}const r={id:'r'+Date.now()+Math.random().toString(36).slice(2,5),date:String(f.get('date')),item:String(f.get('item')).trim().slice(0,65),origin:String(f.get('origin')),method:String(f.get('method')),status,received,returned,cost,value};if(!r.item||!r.date){toast('Preencha o material e a data.');return}state.records.push(r);save();render();toast('Lote registrado no painel.')}

{title:'Quem pode fazer a coleta?',desc:'O tambor está pronto para retirada. Como seguir com a logística reversa?',options:['Entregar a qualquer pessoa interessada.','Jogar no lixo comum, porque já está em um tambor.','Acionar coletor autorizado, verificar documentação e guardar certificado de coleta.'],correct:2,feedback:'A coleta deve ser feita por agente regularizado. O certificado e os documentos de transporte permitem demonstrar a movimentação.'},
{title:'Como fechar o ciclo do óleo?',desc:'Depois da coleta autorizada, qual caminho materializa a economia circular?',options:['Rerrefino industrial para recuperar óleo básico, utilizado depois na formulação de novos lubrificantes.','Usar o óleo contaminado diretamente em outro motor.','Espalhar o óleo em uma pista para evitar poeira.'],correct:0,feedback:'O rerrefino remove contaminantes e recupera óleo básico. A fabricação de novo lubrificante exige formulação e controle industrial.'}
];
function oilStats(){const v=state.oilLots||[],gen=sum(v,x=>x.generated),col=sum(v,x=>x.collected),proc=sum(v,x=>x.processed),base=sum(v,x=>x.base);return{count:v.length,generated:gen,collected:col,processed:proc,base,stored:Math.max(0,gen-col),notRerefined:Math.max(0,col-proc),collectionRate:gen?col/gen*100:0,returnRate:gen?base/gen*100:0,processRate:col?proc/col*100:0,efficiency:proc?base/proc*100:0,cost:sum(v,x=>x.cost),value:sum(v,x=>x.value)}}
function oilDashboardStrip(){const z=oilStats();return `<div class="card" style="margin-top:16px;border-left:4px solid #378d69"><div class="section-header"><div><h3>🛢️ Óleo lubrificante: um novo ciclo</h3><p class="card-caption">Indicadores independentes dos materiais do automóvel; a medição do óleo utiliza litros (L).</p></div><button class="btn secondary" data-view="oil">Explorar o ciclo →</button></div><div class="metrics">${metric('OLUC gerado',`${num(z.generated,1)} L`,'Óleo retirado em manutenção fictícia','🛢️')}${metric('Coleta registrada',`${num(z.collected,1)} L`,'Destino declarado no cadastro','🚚')}${metric('Óleo básico recuperado',`${num(z.base,1)} L`,'Estimativa declarada após rerrefino','♻️')}${metric('Retorno material',pct(z.returnRate),'Óleo básico / OLUC gerado','🌱')}</div><div class="info-note">Exemplo de circularidade: <b>óleo usado → coletor autorizado → rerrefinador → óleo básico recuperado → novo lubrificante</b>. Dados iniciais fictícios.</div></div>`}
function oilFlow(){return `<div class="oil-flow"><div class="oil-node">🚗<strong>1. Troca de óleo</strong><small>Veículo a combustão/híbrido ou equipamento da indústria</small></div><div class="oil-node">🛢️<strong>2. Segregação</strong><small>Recipiente apropriado, identificado e sem misturas</small></div><div class="oil-node">🚚<strong>3. Coleta</strong><small>Operador autorizado e certificado de coleta</small></div><div class="oil-node">🏭<strong>4. Rerrefino</strong><small>Processamento em instalação autorizada</small></div><div class="oil-node">♻️<strong>5. Novo ciclo</strong><small>Óleo básico para formular novos lubrificantes</small></div></div>`}
function oilMissionVisible(){const q=OIL_QUESTIONS[oilMission.idx],a=oilMission.answers[oilMission.idx],done=a!==undefined,score=OIL_QUESTIONS.reduce((v,x,i)=>v+(oilMission.answers[i]===x.correct?1:0),0);return `<div class="card" id="oil-mission"><div class="section-header"><div><h3>🎮 Missão óleo: decisões de uma fábrica circular</h3><p class="card-caption">Três situações rápidas. Cada acerto vale 1 ponto; o resultado fica no relatório individual.</p></div><span class="oil-badge">${oilMission.idx+1} / ${OIL_QUESTIONS.length} · ${score} acertos</span></div><div class="oil-steps">CENÁRIO ${oilMission.idx+1}</div><h3 style="margin:9px 0">${esc(q.title)}</h3><p class="explain">${esc(q.desc)}</p><div class="oil-game-options">${q.options.map((op,i)=>`<button data-oil-answer="${i}" ${oilMission.finished?'disabled':''} class="${done&&a===i?(i===q.correct?'selected':'wrong'):''}">${String.fromCharCode(65+i)}. ${esc(op)} ${done&&i===q.correct?'✓':''}</button>`).join('')}</div>${done?`<div class="info-note" style="margin-top:12px"><strong>${a===q.correct?'Acertou!':'Vamos corrigir:'}</strong> ${esc(q.feedback)}</div><div class="form-actions" style="margin-top:15px">${oilMission.idx===OIL_QUESTIONS.length-1?`<button class="btn" data-oil-finish ${oilMission.finished?'disabled':''}>🏁 Salvar desempenho</button>`:`<button class="btn" data-oil-next>Próximo cenário →</button>`}</div>`:''}${oilMission.finished?`<div class="oil-tip" style="margin-top:14px">Resultado registrado: <b>${score}/3 (${num(score/3*100,1)}%)</b>. <button class="btn tiny outline" data-oil-restart>Fazer outra missão</button></div>`:''}</div>`}

function finishOilMission(){if(oilMission.finished||!authUser||OIL_QUESTIONS.some((q,i)=>oilMission.answers[i]===undefined)){toast('Responda aos três cenários para finalizar.');return}const correct=OIL_QUESTIONS.filter((q,i)=>oilMission.answers[i]===q.correct).length;const r={id:'om-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),userId:authUser.id,alias:authUser.name,createdAt:new Date().toISOString(),answers:structuredClone(oilMission.answers),correct,total:OIL_QUESTIONS.length,rate:100*correct/OIL_QUESTIONS.length};state.oilMissions.push(r);if(!save()){state.oilMissions.pop();return}oilMission.finished=true;render();toast('Missão óleo salva no seu relatório!')}

alue-z.cost)}</b>. Não representa lucro comprovado; não inclui despesas gerais.</p><p class="card-caption">Referências da coleta e documentos registrados pelos alunos servem apenas à simulação. Este aplicativo <b>não emite</b> certificado de coleta ou MTR oficial.</p></div></div><div class="oil-tip"><b>Segurança:</b> não manipule óleo usado verdadeiro, não despeje no solo, na rede de esgoto ou no lixo, nem queime. Em uma operação real, use coletores e rerrefinadores autorizados, verifique a documentação ambiental e as exigências locais. O óleo contaminado não pode voltar diretamente ao motor: o retorno ocorre após rerrefino e nova formulação industrial.</div><div style="margin-top:16px">${oilMissionVisible()}</div><div style="margin-top:16px">${oilAdminPanel()}</div><div class="card" style="margin-top:16px"><div class="section-header"><div><h3>Rastreabilidade dos lotes de OLUC</h3><p class="card-caption">Os registros ilustram as etapas: armazenagem, coleta e recuperação.</p></div><span class="oil-badge">${z.count} lotes</span></div><div class="table-scroll"><table><thead><tr><th>Data / origem</th><th>Etapa</th><th>Gerado</th><th>Coletado</th><th>Rerrefinado</th><th>Óleo básico</th><th>Certificado (simulado)</th>${authUser.role==='admin'?'<th>Ação</th>':''}</tr></thead><tbody>${state.oilLots.length?state.oilLots.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td>${dateBR(r.date)}<br><b>${esc(r.source)}</b><br><small>${esc(r.origin)}</small></td><td>${esc(r.status)}</td><td>${num(r.generated,1)} L</td><td>${num(r.collected,1)} L</td><td>${num(r.processed,1)} L</td><td><b>${num(r.base,1)} L</b></td><td>${esc(r.certificate||'Pendente')}</td>${authUser.role==='admin'?`<td><div class="btnrow"><button class="btn tiny secondary" data-oil-edit="${esc(r.id)}">Editar</button><button class="btn tiny outline" data-oil-delete="${esc(r.id)}">Excluir</button></div></td>`:''}</tr>`).join(''):`<tr><td colspan="8" class="empty">Nenhum lote registrado.</td></tr>`}</tbody></table></div></div><div class="card" style="margin-top:16px"><h3>Base técnica do processo</h3><ul class="oil-note-list"><li><a href="https://www.gov.br/anp/pt-br/assuntos/distribuicao-e-revenda/lubrificantes/reaproveitamento-de-oleo-usado-ou-contaminado" target="_blank" rel="noopener">ANP: reaproveitamento e rerrefino do óleo</a></li><li><a href="https://www.gov.br/anp/pt-br/assuntos/distribuicao-e-revenda/lubrificantes/relacao-de-agentes-autorizados" target="_blank" rel="noopener">ANP: lista de coletores e rerrefinadores autorizados</a></li><li><a href="https://www.sinir.gov.br/sistemas/mtr/" target="_blank" rel="noopener">SINIR: MTR e movimentação de resíduos</a></li></ul></div>`}
function handleOilForm(form){if(authUser.role!=='admin')return;let f=new FormData(form);const r={id:String(f.get('id')||'').trim()||'oil-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),date:String(f.get('date')||''),source:String(f.get('source')||''),origin:String(f.get('origin')||'').trim().slice(0,75),status:String(f.get('status')||''),generated:Number(f.get('generated')),collected:Number(f.get('collected')),processed:Number(f.get('processed')),base:Number(f.get('base')),collector:String(f.get('collector')||'').trim().slice(0,100),certificate:String(f.get('certificate')||'').trim().slice(0,80),mtr:String(f.get('mtr')||'').trim().slice(0,80),rerrefiner:String(f.get('rerrefiner')||'').trim().slice(0,100),cost:Number(f.get('cost')),value:Number(f.get('value')),notes:String(f.get('notes')||'').trim().slice(0,240)};
if(!r.date||!r.origin||!r.source||![r.generated,r.collected,r.processed,r.base,r.cost,r.value].every(Number.isFinite)||r.generated<=0||r.collected<0||r.processed<0||r.base<0||r.cost<0||r.value<0||r.base>r.processed||r.processed>r.collected||r.collected>r.generated){toast('Confira as quantidades: 0 ≤ básico ≤ rerrefinado ≤ coletado ≤ gerado.');return}

if(r.status==='Coleta registrada'&&(r.collected<=0||r.processed>0||r.base>0)){toast('Na etapa de coleta, informe coleta positiva e rerrefino ainda zero.');return}
if(r.status==='Encaminhado ao rerrefino'&&(r.collected<=0||r.processed>0||r.base>0)){toast('Aguardando rerrefino: registre o volume processado somente após comprovação.');return}
if(r.status==='Rerrefino comprovado (simulação)'&&(r.processed<=0||r.base<=0)){toast('Para indicar rerrefino concluído, informe volumes processado e óleo básico maiores que zero.');return}

 // Pneus verticais montados em eixos, calotas com cinco raios e disco central.
 function tire(x,z){const n=22,y=.56,r=.48,sign=Math.sign(z),outer=z+sign*.16,inner=z-sign*.065;
  const pt=(a,zz,rr)=>[x+Math.cos(a)*rr,y+Math.sin(a)*rr,zz];
  for(let j=0;j<n;j++){const a=j*2*Math.PI/n,b=(j+1)*2*Math.PI/n;
    poly([pt(a,inner,r),pt(b,inner,r),pt(b,outer,r),pt(a,outer,r)],'#1c272e','wheels',j%3===0?.8:.94);
    poly([pt(a,outer,r),pt(b,outer,r),pt(b,outer,.33),pt(a,outer,.33)],color('wheels','#202d35'),'wheels',1.0);
    poly([pt(a,outer,.31),pt(b,outer,.31),pt(b,outer,.24),pt(a,outer,.24)],'#becdd1','wheels',1);
  }
  for(let k=0;k<5;k++){const a=(k-.5)*Math.PI*2/5;poly([pt(a-.11,outer+.007,.14),pt(a-.10,outer+.007,.295),pt(a+.10,outer+.007,.295),pt(a+.11,outer+.007,.14)],'#eaf1ef','wheels',1.07)}
  poly(Array.from({length:14},(_,j)=>pt(j*Math.PI*2/14,outer+.008,.12)),'#637d83','wheels',1.06);
 }
 for(const x of [-1.50,1.51])for(const z of [-.83,.83])tire(x,z);

 faces.sort((a,b)=>b.z-a.z);for(const f of faces){c.beginPath();c.moveTo(f.pp[0].x,f.pp[0].y);for(let j=1;j<f.pp.length;j++)c.lineTo(f.pp[j].x,f.pp[j].y);c.closePath();c.globalAlpha=f.alpha;c.fillStyle=f.clr;c.fill();if(f.outline){c.strokeStyle='#102f3633';c.lineWidth=.6;c.stroke()}}c.globalAlpha=1;
 // Peça ativa destacada por marcação e legenda.
 const loc={body:[-.2,1.88,.0],motor:[1.46,1.28,.16],battery:[-.55,.51,.35],wheels:[1.52,.56,1.09],bumper:[2.42,.74,.1],seats:[-.83,1.26,.52],cables:[.9,1.02,.05],panel:[-.12,1.62,.71]};
 const pt=pr(loc[selected]||[0,1,0]);c.save();c.strokeStyle='#146b63';c.lineWidth=1.6;c.setLineDash([4,4]);c.beginPath();c.moveTo(pt.x,pt.y);c.lineTo(pt.x,Math.max(28,pt.y-44));c.stroke();c.setLineDash([]);c.fillStyle='#fff';c.strokeStyle=game.choices[selected]==='circular'?'#199d7a':game.choices[selected]==='new'?'#e9953b':'#178b8f';c.lineWidth=3;c.beginPath();c.arc(pt.x,pt.y,6,0,Math.PI*2);c.fill();c.stroke();const t=PARTS[game.idx].name;c.font='700 12px system-ui';const tw=c.measureText(t).width+23,tx=Math.max(4,Math.min(w-tw-4,pt.x-tw/2)),ty=Math.max(10,pt.y-77);c.fillStyle='#123a40';c.beginPath();c.roundRect(tx,ty,tw,29,8);c.fill();c.fillStyle='#fff';c.fillText(t,tx+12,ty+19);c.restore();hotspots=[{id:selected,x:pt.x,y:pt.y}];
}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return; if(b.dataset.authMode){renderAuth(b.dataset.authMode);return}if(b.hasAttribute('data-logout')){logoutUser();return}if(b.hasAttribute('data-camera-open')){startCamera();return}if(b.hasAttribute('data-camera-close')){stopCamera();return}if(b.hasAttribute('data-camera-capture')){captureCamera();return}if(b.hasAttribute('data-photo-remove')){photoDraft='';const parent=b.closest('.photo-section');if(parent){const div=parent.querySelector('.photo-preview,.profile-photo');if(div)div.outerHTML=photoElement('','photo-preview')}return}if(b.hasAttribute('data-close-modal'))closeModal();if(b.dataset.view){setView(b.dataset.view);return}if(b.hasAttribute('data-new-game')){resetGame();toast('Nova montagem iniciada.');return}if(b.dataset.choice){if(game.finished){toast('Para alterar escolhas, inicie uma nova montagem.');return}game.choices[PARTS[game.idx].id]=b.dataset.choice;render();return}if(b.hasAttribute('data-game-next')){game.idx=Math.min(PARTS.length-1,game.idx+1);render();return}if(b.hasAttribute('data-game-prev')){game.idx=Math.max(0,game.idx-1);render();return}if(b.dataset.part!==undefined){game.idx=Math.max(0,Math.min(PARTS.length-1,Number(b.dataset.part)));render();return}if(b.hasAttribute('data-finish')){finishGame();return}if(b.dataset.camera){if(b.dataset.camera==='reset')cam={yaw:.79,pitch:.24,zoom:1};else cam.zoom=Math.max(.66,Math.min(1.8,cam.zoom*(b.dataset.camera==='in'?1.16:.86)));draw3D(performance.now());return}if(b.dataset.deleteRecord){if(authUser.role!=='admin')return;if(!confirm('Excluir este lote?'))return;state.records=state.records.filter(x=>x.id!==b.dataset.deleteRecord);save();render();toast('Lote excluído.');return}if(b.dataset.sessionDetails){openSessionDetails(b.dataset.sessionDetails);return}if(b.dataset.deleteSession){if(authUser.role!=='admin')return;if(!confirm('Excluir este resultado?'))return;state.sessions=state.sessions.filter(x=>x.id!==b.dataset.deleteSession);save();render();toast('Resultado excluído.');return}if(b.hasAttribute('data-export-records')){if(authUser.role!=='admin')return;exportRecords();return}if(b.hasAttribute('data-oil-export')){if(authUser.role!=='admin')return;exportOilCSV();return}if(b.hasAttribute('data-oil-missions-export')){exportOilMissionsCSV();return}if(b.dataset.oilEdit){editOilLot(b.dataset.oilEdit);return}if(b.dataset.oilDelete){deleteOilLot(b.dataset.oilDelete);return}if(b.hasAttribute('data-oil-new')){oilEditing='';render();return}if(b.hasAttribute('data-oil-restart')){oilMission={idx:0,answers:{},finished:false};render();return}if(b.dataset.oilAnswer!==undefined){selectOilAnswer(Number(b.dataset.oilAnswer));return}if(b.hasAttribute('data-oil-next')){oilMission.idx=Math.min(OIL_QUESTIONS.length-1,oilMission.idx+1);render();return}if(b.hasAttribute('data-oil-finish')){finishOilMission();return}if(b.hasAttribute('data-export-sessions')){exportSessions();return}if(b.hasAttribute('data-export-json')){downloadJson();return}if(b.hasAttribute('data-print')){buildPrint();appendOilPrint();window.print();return}if(b.hasAttribute('data-reset')){if(authUser.role!=='admin')return;if(!confirm('Restaurar dados de demonstração? Isso apaga os lotes, registros de óleo e resultados dos visitantes neste navegador.'))return;state=seed();save();resetGame();setView('dashboard');toast('Dados de demonstração restaurados.');return}});
